<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steam Accounts</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-synthesis: none;
      --bg: oklch(13% 0.012 265);
      --surface-1: oklch(17% 0.013 265);
      --surface-2: oklch(21% 0.014 265);
      --surface-3: oklch(25% 0.015 265);
      --text: oklch(92% 0.008 265);
      --muted: oklch(68% 0.014 265);
      --faint: oklch(48% 0.013 265);
      --line: oklch(31% 0.014 265);
      --accent: oklch(72% 0.075 250);
      --danger: oklch(68% 0.115 25);
      --success: oklch(73% 0.08 155);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body {
      min-width: 720px;
      min-height: 560px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      letter-spacing: .01em;
      overflow: hidden;
      user-select: none;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .app {
      position: relative;
      height: 100vh;
      background:
        radial-gradient(circle at 84% 8%, oklch(25% .025 255), transparent 31%),
        var(--bg);
      border: 1px solid oklch(35% .018 265);
      border-radius: 18px;
      overflow: hidden;
    }
    .titlebar {
      height: 52px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 12px 0 20px;
      background: oklch(17% .013 265 / .82);
      backdrop-filter: blur(22px) saturate(115%);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: .875rem; font-weight: 650; }
    .brand-mark {
      width: 24px; height: 24px; display: grid; place-items: center;
      border-radius: 8px; background: var(--surface-3); color: var(--accent);
    }
    .brand-mark svg { width: 14px; height: 14px; }
    .window-actions { display: flex; gap: 4px; }
    .window-button {
      width: 38px; height: 34px; border: 0; border-radius: 10px;
      background: transparent; color: var(--muted); display: grid; place-items: center;
      transition: transform 120ms var(--ease), background 120ms, color 120ms;
    }
    .window-button:hover { background: var(--surface-3); color: var(--text); }
    .window-button:active { transform: scale(.92); }
    .window-button.close:hover { background: oklch(42% .1 25); }

    main { height: calc(100vh - 52px); overflow: auto; padding: 40px 44px 56px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 32px; margin-bottom: 32px; }
    h1 { margin: 0 0 6px -.04em; font-size: clamp(1.9rem, 4vw, 2.65rem); line-height: 1.08; letter-spacing: -.045em; text-wrap: balance; }
    .subtitle { margin: 0; color: var(--muted); max-width: 58ch; font-size: .875rem; }
    .scan-button {
      min-height: 44px; flex: none; display: inline-flex; align-items: center; gap: 9px;
      border: 1px solid var(--line); border-radius: 14px; padding: 0 16px;
      background: var(--surface-2); font-weight: 650; font-size: .875rem;
      transition: transform 120ms var(--ease), background 160ms;
    }
    .scan-button:hover { background: var(--surface-3); }
    .scan-button:active { transform: scale(.97); }
    .scan-button svg { width: 17px; height: 17px; }
    .scan-button.loading svg { animation: spin .7s linear infinite; }

    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .segments { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-1); border: 1px solid var(--line); }
    .segment { min-height: 36px; border: 0; border-radius: 10px; padding: 0 13px; background: transparent; color: var(--muted); font-size: .875rem; font-weight: 600; }
    .segment[aria-selected="true"] { color: var(--text); background: var(--surface-3); }
    .search { position: relative; margin-left: auto; }
    .search svg { position: absolute; width: 16px; height: 16px; left: 13px; top: 12px; color: var(--faint); pointer-events: none; }
    .search input {
      width: min(260px, 28vw); min-height: 42px; border: 1px solid var(--line); border-radius: 13px;
      padding: 0 14px 0 38px; color: var(--text); background: var(--surface-1);
    }
    .search input::placeholder { color: var(--faint); }

    .accounts { border-top: 1px solid var(--line); }
    .account {
      display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 16px; align-items: center;
      min-height: 88px; padding: 14px 8px; border-bottom: 1px solid var(--line);
      animation: enter 430ms var(--ease) both; animation-delay: calc(var(--i) * 45ms);
    }
    .avatar { width: 54px; height: 54px; border-radius: 17px; object-fit: cover; background: var(--surface-3); border: 1px solid oklch(37% .018 265); }
    .avatar-fallback { display: grid; place-items: center; color: var(--muted); font-weight: 720; font-size: 1.1rem; }
    .identity { min-width: 0; }
    .name-row { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .persona { font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { flex: none; display: inline-flex; align-items: center; gap: 6px; color: var(--success); font-size: .75rem; font-weight: 700; }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 4px oklch(73% .08 155 / .1); }
    .meta { display: flex; gap: 10px; margin-top: 4px; color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
    .meta span + span::before { content: "•"; margin-right: 10px; color: var(--faint); }
    .remembered { color: var(--muted); font-size: .75rem; text-align: right; }
    .delete-button {
      width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 13px;
      background: transparent; color: var(--faint); transition: transform 120ms var(--ease), color 160ms, background 160ms;
    }
    .delete-button:hover { color: var(--danger); background: oklch(25% .04 25); }
    .delete-button:active { transform: scale(.92); }
    .delete-button svg { width: 18px; height: 18px; }

    .state { min-height: 260px; display: grid; place-items: center; text-align: center; color: var(--muted); }
    .state-inner { max-width: 42ch; }
    .state h2 { margin: 0 0 7px; color: var(--text); font-size: 1.25rem; }
    .state p { margin: 0; font-size: .875rem; }
    .skeleton { height: 88px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; }
    .skeleton-avatar, .skeleton-line { background: var(--surface-2); animation: pulse 1.2s ease-in-out infinite alternate; }
    .skeleton-avatar { width: 54px; height: 54px; border-radius: 17px; }
    .skeleton-lines { flex: 1; display: grid; gap: 10px; }
    .skeleton-line { height: 10px; width: 36%; border-radius: 5px; }
    .skeleton-line:last-child { width: 58%; opacity: .65; }

    dialog {
      width: min(468px, calc(100vw - 40px)); padding: 0; color: var(--text);
      border: 1px solid oklch(37% .018 265); border-radius: 22px;
      background: oklch(20% .015 265 / .94); backdrop-filter: blur(28px) saturate(110%);
      box-shadow: 0 28px 80px oklch(5% .01 265 / .55);
      opacity: 0; transform: translateY(12px) scale(.97);
      transition: opacity 180ms var(--ease), transform 260ms var(--ease), overlay 260ms allow-discrete, display 260ms allow-discrete;
    }
    dialog[open] { opacity: 1; transform: translateY(0) scale(1); }
    @starting-style { dialog[open] { opacity: 0; transform: translateY(12px) scale(.97); } }
    dialog::backdrop { background: oklch(7% .01 265 / .7); backdrop-filter: blur(5px); }
    .dialog-body { padding: 28px 28px 18px; }
    .danger-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 15px; color: var(--danger); background: oklch(27% .045 25); margin-bottom: 20px; }
    .danger-icon svg { width: 21px; height: 21px; }
    dialog h2 { margin: 0 0 9px; font-size: 1.25rem; }
    dialog p { margin: 0 0 20px; color: var(--muted); font-size: .875rem; text-wrap: pretty; }
    dialog label { display: block; margin-bottom: 8px; color: var(--muted); font-size: .75rem; font-weight: 650; }
    dialog input { width: 100%; min-height: 46px; padding: 0 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--surface-1); color: var(--text); }
    .dialog-note { margin-top: 12px; color: var(--faint); font-size: .75rem; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 28px 24px; }
    .dialog-actions button { min-height: 44px; border-radius: 13px; padding: 0 16px; border: 0; font-weight: 680; }
    .cancel { background: var(--surface-3); }
    .confirm { background: var(--danger); color: oklch(18% .03 25); }
    .confirm:disabled { opacity: .35; cursor: not-allowed; }

    .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 18px); opacity: 0; padding: 11px 15px; border-radius: 13px; background: var(--surface-3); border: 1px solid var(--line); font-size: .875rem; pointer-events: none; transition: opacity 180ms, transform 260ms var(--ease); }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .hidden { display: none !important; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes enter { from { opacity: 0; transform: translateY(8px); } }
    @keyframes pulse { to { background: var(--surface-3); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    @media (max-width: 820px) {
      body { min-width: 540px; }
      main { padding: 28px 24px 44px; }
      header { align-items: start; }
      .remembered { display: none; }
      .account { grid-template-columns: auto minmax(0, 1fr) auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="titlebar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="15" r="3" stroke="currentColor" stroke-width="2"/><circle cx="16.5" cy="7.5" r="4.5" stroke="currentColor" stroke-width="2"/><path d="m11.5 13.3 2.4-2.4M6.3 16.3 2.5 14.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        Steam Accounts
      </div>
      <div class="window-actions">
        <button class="window-button" id="minimize" aria-label="Свернуть"><svg viewBox="0 0 24 24"><path d="M7 12h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
        <button class="window-button close" id="close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m8 8 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
      </div>
    </div>

    <main>
      <header>
        <div>
          <h1>Аккаунты на этом компьютере</h1>
          <p class="subtitle" id="summary">Проверяем локальные данные Steam…</p>
        </div>
        <button class="scan-button" id="refresh"><svg viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Сканировать</button>
      </header>

      <section class="toolbar" aria-label="Фильтры">
        <div class="segments" role="tablist">
          <button class="segment" data-filter="all" aria-selected="true">Все</button>
          <button class="segment" data-filter="active" aria-selected="false">Сейчас в Steam</button>
          <button class="segment" data-filter="history" aria-selected="false">История</button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Имя или Steam ID" aria-label="Поиск аккаунтов" />
        </label>
      </section>

      <section class="accounts" id="accounts" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="delete-dialog">
    <form method="dialog" id="delete-form">
      <div class="dialog-body">
        <div class="danger-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <h2>Удалить локальный след?</h2>
        <p id="delete-copy"></p>
        <label for="confirm-input">Введите «подтверждаю»</label>
        <input id="confirm-input" autocomplete="off" spellcheck="false" />
        <div class="dialog-note" id="delete-note">Аккаунт Steam, игры и сохранения не удаляются.</div>
      </div>
      <div class="dialog-actions">
        <button class="cancel" value="cancel">Отмена</button>
        <button class="confirm" id="confirm-delete" value="default" disabled>Удалить локальные данные</button>
      </div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>

  <script type="module">
    const { invoke } = window.__TAURI__.core;
    const { getCurrentWindow } = window.__TAURI__.window;
    const appWindow = getCurrentWindow();
    const el = (id) => document.getElementById(id);
    const accountsEl = el('accounts');
    const summaryEl = el('summary');
    const refreshBtn = el('refresh');
    const dialog = el('delete-dialog');
    const confirmInput = el('confirm-input');
    const confirmButton = el('confirm-delete');
    let state = { accounts: [], steamRunning: false, filter: 'all', query: '', selected: null };

    el('minimize').addEventListener('click', () => appWindow.minimize());
    el('close').addEventListener('click', () => appWindow.close());
    refreshBtn.addEventListener('click', scan);
    el('search').addEventListener('input', (e) => { state.query = e.target.value.trim().toLowerCase(); render(); });
    document.querySelectorAll('.segment').forEach((button) => button.addEventListener('click', () => {
      state.filter = button.dataset.filter;
      document.querySelectorAll('.segment').forEach((item) => item.setAttribute('aria-selected', String(item === button)));
      render();
    }));
    confirmInput.addEventListener('input', () => { confirmButton.disabled = confirmInput.value.trim().toLowerCase() !== 'подтверждаю'; });
    el('delete-form').addEventListener('submit', async (event) => {
      if (event.submitter?.value !== 'default') return;
      event.preventDefault();
      if (!state.selected || confirmButton.disabled) return;
      confirmButton.disabled = true;
      confirmButton.textContent = 'Удаляем…';
      try {
        await invoke('delete_local_account_data', { steamId: state.selected.steam_id, confirmation: confirmInput.value });
        dialog.close();
        showToast('Локальные данные удалены');
        await scan();
      } catch (error) {
        showToast(String(error));
        confirmButton.disabled = false;
      } finally {
        confirmButton.textContent = 'Удалить локальные данные';
      }
    });

    function escapeHtml(value = '') {
      return value.replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }
    function relativeTime(timestamp) {
      if (!timestamp) return 'Время входа неизвестно';
      const date = new Date(timestamp * 1000);
      return `Последний вход: ${new Intl.DateTimeFormat('ru', { day: 'numeric', month: 'short', year: 'numeric' }).format(date)}`;
    }
    function openDelete(account) {
      state.selected = account;
      confirmInput.value = '';
      confirmButton.disabled = true;
      el('delete-copy').innerHTML = `Будет удалена запись о <strong>${escapeHtml(account.persona_name || account.account_name)}</strong>, её аватар и кэш этого приложения.`;
      el('delete-note').textContent = state.steamRunning ? 'Сначала полностью закройте Steam, иначе он восстановит запись.' : 'Аккаунт Steam, игры, userdata и сохранения не удаляются.';
      dialog.showModal();
      setTimeout(() => confirmInput.focus(), 80);
    }
    function filteredAccounts() {
      return state.accounts.filter((account) => {
        const byTab = state.filter === 'all' || (state.filter === 'active' ? account.is_active : !account.is_active);
        const haystack = `${account.persona_name} ${account.account_name} ${account.steam_id}`.toLowerCase();
        return byTab && haystack.includes(state.query);
      });
    }
    function render() {
      const accounts = filteredAccounts();
      if (!accounts.length) {
        accountsEl.innerHTML = `<div class="state"><div class="state-inner"><h2>${state.accounts.length ? 'Ничего не найдено' : 'Локальных аккаунтов нет'}</h2><p>${state.accounts.length ? 'Смените фильтр или поисковый запрос.' : 'Войдите в Steam хотя бы один раз, затем запустите сканирование.'}</p></div></div>`;
        return;
      }
      accountsEl.innerHTML = accounts.map((account, index) => {
        const initials = (account.persona_name || account.account_name || '?').slice(0, 2).toUpperCase();
        const avatar = account.avatar_data_url
          ? `<img class="avatar" src="${account.avatar_data_url}" alt="" />`
          : `<div class="avatar avatar-fallback" aria-hidden="true">${escapeHtml(initials)}</div>`;
        return `<article class="account" style="--i:${Math.min(index, 8)}">
          ${avatar}
          <div class="identity">
            <div class="name-row"><span class="persona">${escapeHtml(account.persona_name || account.account_name)}</span>${account.is_active ? '<span class="badge">Сейчас в Steam</span>' : ''}</div>
            <div class="meta"><span>${escapeHtml(account.account_name)}</span><span>${escapeHtml(account.steam_id)}</span></div>
          </div>
          <div class="remembered">${relativeTime(account.timestamp)}</div>
          <button class="delete-button" data-id="${account.steam_id}" aria-label="Удалить локальные данные ${escapeHtml(account.persona_name)}"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </article>`;
      }).join('');
      accountsEl.querySelectorAll('.delete-button').forEach((button) => button.addEventListener('click', () => openDelete(state.accounts.find((item) => item.steam_id === button.dataset.id))));
    }
    function loading() {
      accountsEl.innerHTML = Array.from({ length: 3 }, () => '<div class="skeleton"><div class="skeleton-avatar"></div><div class="skeleton-lines"><div class="skeleton-line"></div><div class="skeleton-line"></div></div></div>').join('');
    }
    function showToast(message) {
      const toast = el('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2800);
    }
    async function scan() {
      refreshBtn.classList.add('loading');
      refreshBtn.disabled = true;
      loading();
      try {
        const result = await invoke('scan_steam_accounts');
        state.accounts = result.accounts;
        state.steamRunning = result.steam_running;
        const active = result.accounts.filter((a) => a.is_active).length;
        summaryEl.textContent = `${result.accounts.length} ${result.accounts.length === 1 ? 'аккаунт' : 'аккаунтов'} найдено${active ? `, ${active} сейчас используется` : ''}`;
        render();
      } catch (error) {
        state.accounts = [];
        accountsEl.innerHTML = `<div class="state"><div class="state-inner"><h2>Steam не найден</h2><p>${escapeHtml(String(error))}</p></div></div>`;
        summaryEl.textContent = 'Не удалось прочитать локальные данные';
      } finally {
        refreshBtn.classList.remove('loading');
        refreshBtn.disabled = false;
      }
    }
    scan();
  </script>
</body>
</html>
