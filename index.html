<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steam Accounts</title><style>
:root{color-scheme:dark;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;--bg:oklch(13.8% .018 260);--bar:oklch(18% .022 260);--s1:oklch(20% .024 260);--s2:oklch(25% .028 260);--s3:oklch(29% .032 260);--line:oklch(37% .025 260);--text:oklch(94% .012 260);--muted:oklch(72% .018 260);--faint:oklch(52% .018 260);--blue:oklch(76% .08 245);--green:oklch(76% .075 155);--red:oklch(70% .12 25);--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden}body{min-width:720px;min-height:560px;font-size:16px;line-height:1.5;letter-spacing:.012em}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}.segments{display:flex;gap:4px;padding:4px;border:1px solid oklch(43% .03 260);border-radius:15px;background:oklch(18% .022 260/.72);box-shadow:0 6px 20px oklch(8% .02 260/.18),0 1px 0 oklch(100% .02 260/.1) inset}.segment{height:36px;padding:0 13px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:.875rem;font-weight:620;transition:background .2s var(--ease),color .2s}.segment:hover{color:var(--text)}.segment[aria-selected=true]{background:linear-gradient(145deg,var(--s3),var(--s2));color:var(--text);box-shadow:0 2px 8px oklch(7% .02 260/.3),0 1px 0 oklch(100% .02 260/.1) inset}.search{position:relative;margin-left:auto}.search svg{position:absolute;left:13px;top:13px;width:16px;color:var(--faint);pointer-events:none}.search input{width:min(260px,28vw);height:44px;padding:0 14px 0 38px;border:1px solid oklch(42% .03 260);border-radius:14px;background:oklch(18% .022 260/.8);color:var(--text);box-shadow:0 1px 0 oklch(100% .02 260/.08) inset}.search input::placeholder{color:var(--faint)}
.accounts{border-top:1px solid oklch(41% .025 260)}.account{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:16px;align-items:center;min-height:90px;padding:14px 8px;border-bottom:1px solid oklch(35% .022 260);animation:rise .45s var(--ease) both;animation-delay:calc(var(--i,0)*38ms);transition:background .18s var(--ease)}.account:hover{background:linear-gradient(90deg,oklch(28% .03 250/.2),transparent 75%)}.avatar{width:56px;height:56px;border:1px solid oklch(60% .03 250/.32);border-radius:18px;object-fit:cover;background:linear-gradient(145deg,var(--s3),var(--s1));box-shadow:0 7px 20px oklch(6% .02 260/.34),0 1px 0 oklch(100% .03 260/.12) inset}.fallback{display:grid;place-items:center;color:var(--muted);font-weight:720}.identity{min-width:0}.name-row{display:flex;align-items:center;gap:9px}.persona{font-weight:680;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{display:flex;align-items:center;gap:6px;color:var(--green);font-size:.75rem;font-weight:700}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px oklch(76% .075 155/.12)}.meta{display:flex;gap:10px;margin-top:4px;color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}.meta span+span:before{content:"•";margin-right:10px;color:var(--faint)}.when{text-align:right;color:var(--muted);font-size:.75rem}.delete{width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:13px;background:transparent;color:var(--faint);transition:transform .12s var(--ease),background .18s,color .18s}.delete:hover{background:oklch(28% .045 25);color:var(--red)}.delete:active{transform:scale(.92)}.delete svg{width:18px}.state{min-height:250px;display:grid;place-items:center;text-align:center;color:var(--muted)}.state h2{margin:0 0 6px;color:var(--text);font-size:1.25rem}.state p{margin:0;font-size:.875rem}.skeleton{height:90px;border-bottom:1px solid oklch(35% .022 260);display:flex;align-items:center;gap:16px}.sk-a,.sk-l{background:linear-gradient(100deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:shimmer 1.3s linear infinite}.sk-a{width:56px;height:56px;border-radius:18px}.sk-lines{flex:1;display:grid;gap:10px}.sk-l{height:10px;width:38%;border-radius:6px}.sk-l:last-child{width:58%}
dialog{width:min(468px,calc(100vw - 40px));padding:0;border:1px solid oklch(55% .04 250/.38);border-radius:24px;background:linear-gradient(145deg,oklch(29% .035 250/.98),oklch(20% .025 260/.98));color:var(--text);box-shadow:0 30px 100px oklch(4% .02 260/.7),0 1px 0 oklch(100% .03 260/.16) inset}dialog::backdrop{background:oklch(7% .02 260/.82);backdrop-filter:blur(7px)}.dialog-body{padding:30px 30px 18px}.danger-icon{width:46px;height:46px;display:grid;place-items:center;margin-bottom:20px;border:1px solid oklch(70% .1 25/.18);border-radius:16px;background:oklch(34% .055 25);color:var(--red)}.danger-icon svg{width:21px}dialog h2{margin:0 0 9px;font-size:1.25rem}dialog p{margin:0 0 20px;color:var(--muted);font-size:.875rem}dialog label{display:block;margin-bottom:8px;color:var(--muted);font-size:.75rem;font-weight:650}dialog input{width:100%;height:48px;padding:0 14px;border:1px solid oklch(46% .03 260);border-radius:14px;background:oklch(14% .018 260/.8);color:var(--text)}.note{margin-top:12px;color:var(--faint);font-size:.75rem}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;padding:16px 30px 26px}.dialog-actions button{height:44px;padding:0 16px;border:0;border-radius:14px;font-weight:680}.cancel{background:var(--s3)}.confirm{background:var(--red);color:oklch(18% .03 25)}.confirm:disabled{opacity:.35}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;padding:11px 15px;border:1px solid oklch(50% .03 260);border-radius:14px;background:var(--s3);box-shadow:0 12px 34px oklch(5% .02 260/.4);font-size:.875rem;pointer-events:none;transition:opacity .18s,transform .26s var(--ease)}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{from{opacity:0;transform:translateY(8px)}}@keyframes shimmer{to{background-position:-200% 0}}@media(max-width:820px){body{min-width:540px}main{padding:28px 24px 44px}.when{display:none}.account{grid-template-columns:auto minmax(0,1fr) auto}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="app"><div class="titlebar" id="titlebar"><div class="drag" data-tauri-drag-region><span class="mark"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="15" r="3" stroke="currentColor" stroke-width="2"/><circle cx="16.5" cy="7.5" r="4.5" stroke="currentColor" stroke-width="2"/><path d="m11.5 13.3 2.4-2.4M6.3 16.3 2.5 14.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>Steam Accounts</div><div class="actions"><button class="win" id="minimize" aria-label="Свернуть"><svg viewBox="0 0 24 24"><path d="M7 12h10" stroke="currentColor" stroke-width="1.8"/></svg></button><button class="win close" id="close" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="m8 8 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.8"/></svg></button></div></div><main><header><div><h1>Аккаунты на этом компьютере</h1><p class="subtitle" id="summary">Проверяем локальные данные Steam…</p></div><button class="scan" id="refresh"><svg viewBox="0 0 24 24" fill="none"><path d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Сканировать</button></header><section class="toolbar"><div class="segments"><button class="segment" data-filter="all" aria-selected="true">Все</button><button class="segment" data-filter="active" aria-selected="false">Сейчас в Steam</button><button class="segment" data-filter="history" aria-selected="false">История</button></div><label class="search"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8"/></svg><input id="search" type="search" placeholder="Имя или Steam ID"></label></section><section class="accounts" id="accounts" aria-live="polite"></section></main></div><dialog id="delete-dialog"><form method="dialog" id="delete-form"><div class="dialog-body"><div class="danger-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke="currentColor" stroke-width="1.8"/></svg></div><h2>Удалить локальный след?</h2><p id="delete-copy"></p><label for="confirm-input">Введите «подтверждаю»</label><input id="confirm-input" autocomplete="off"><div class="note" id="delete-note">Игры и сохранения не удаляются.</div></div><div class="dialog-actions"><button class="cancel" value="cancel">Отмена</button><button class="confirm" id="confirm-delete" value="default" disabled>Удалить локальные данные</button></div></form></dialog><div class="toast" id="toast"></div><script type="module">
const{invoke}=window.__TAURI__.core;const{getCurrentWindow}=window.__TAURI__.window;const win=getCurrentWindow(),$=id=>document.getElementById(id),listEl=$('accounts'),summary=$('summary'),refresh=$('refresh'),dialog=$('delete-dialog'),input=$('confirm-input'),confirm=$('confirm-delete');let state={accounts:[],running:false,filter:'all',query:'',selected:null};$('titlebar').addEventListener('pointerdown',e=>{if(e.button===0&&!e.target.closest('button'))win.startDragging()});$('minimize').onclick=()=>win.minimize();$('close').onclick=()=>win.close();refresh.onclick=scan;$('search').oninput=e=>{state.query=e.target.value.trim().toLocaleLowerCase('ru');render()};document.querySelectorAll('.segment').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll('.segment').forEach(x=>x.setAttribute('aria-selected',x===b));render()});input.oninput=()=>confirm.disabled=input.value.trim().toLocaleLowerCase('ru')!=='подтверждаю';const esc=(v='')=>v.replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const date=t=>t?`Последний след: ${new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'short',year:'numeric'}).format(new Date(t*1000))}`:'Дата неизвестна';function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}function openDelete(a){state.selected=a;input.value='';confirm.disabled=true;$('delete-copy').innerHTML=`Скроем <strong>${esc(a.persona_name||a.account_name)}</strong> из истории и удалим доступную локальную запись.`;$('delete-note').textContent=state.running?'Сначала полностью закройте Steam.':'Папка userdata, игры и сохранения останутся.';dialog.showModal();setTimeout(()=>input.focus(),70)}function filtered(){return state.accounts.filter(a=>(state.filter==='all'||(state.filter==='active'?a.is_active:!a.is_active))&&`${a.persona_name} ${a.account_name} ${a.steam_id}`.toLocaleLowerCase('ru').includes(state.query))}function render(){const data=filtered();if(!data.length){listEl.innerHTML=`<div class="state"><div><h2>${state.accounts.length?'Ничего не найдено':'Локальных аккаунтов нет'}</h2><p>${state.accounts.length?'Смените фильтр или поиск.':'Steam не оставил локальных записей.'}</p></div></div>`;return}listEl.innerHTML=data.map((a,i)=>{const n=(a.persona_name||a.account_name||'?').slice(0,2).toLocaleUpperCase('ru'),av=a.avatar_data_url?`<img class="avatar" src="${a.avatar_data_url}" alt="">`:`<div class="avatar fallback">${esc(n)}</div>`,src=a.source==='userdata'?'Найден в userdata':'Сохранён Steam';return`<article class="account" style="--i:${Math.min(i,8)}">${av}<div class="identity"><div class="name-row"><span class="persona">${esc(a.persona_name||a.account_name)}</span>${a.is_active?'<span class="badge">Сейчас в Steam</span>':''}</div><div class="meta"><span>${esc(a.account_name)}</span><span>${esc(a.steam_id)}</span><span>${src}</span></div></div><div class="when">${date(a.timestamp)}</div><button class="delete" data-id="${a.steam_id}" aria-label="Удалить"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5" stroke="currentColor" stroke-width="1.8"/></svg></button></article>`}).join('');listEl.querySelectorAll('.delete').forEach(b=>b.onclick=()=>openDelete(state.accounts.find(a=>a.steam_id===b.dataset.id)))}$('delete-form').onsubmit=async e=>{if(e.submitter?.value!=='default')return;e.preventDefault();if(!state.selected||confirm.disabled)return;confirm.disabled=true;try{await invoke('delete_local_account_data',{steamId:state.selected.steam_id,confirmation:input.value});dialog.close();toast('Локальный след удалён');await scan()}catch(err){toast(String(err));confirm.disabled=false}};async function scan(){refresh.classList.add('loading');refresh.disabled=true;listEl.innerHTML=Array.from({length:3},()=>'<div class="skeleton"><div class="sk-a"></div><div class="sk-lines"><div class="sk-l"></div><div class="sk-l"></div></div></div>').join('');try{const r=await invoke('scan_steam_accounts');state.accounts=r.accounts;state.running=r.steam_running;const active=r.accounts.filter(a=>a.is_active).length;summary.textContent=`Найдено: ${r.accounts.length}${active?`, сейчас используется: ${active}`:''}`;render()}catch(err){state.accounts=[];listEl.innerHTML=`<div class="state"><div><h2>Steam не найден</h2><p>${esc(String(err))}</p></div></div>`;summary.textContent='Не удалось прочитать локальные данные'}finally{refresh.classList.remove('loading');refresh.disabled=false}}scan();</script></body></html>
